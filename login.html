<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | SSC 2027 Study Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1020;
      color: white;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #121a33;
      border: 1px solid #29345a;
      border-radius: 20px;
      padding: 30px 22px;
      text-align: center;
    }

    .icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9da6c3;
      margin-bottom: 25px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #29345a;
      border-radius: 12px;
      background: #0b1020;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #6c63ff;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 25px;
      background: #6c63ff;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #9b95ff;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="icon">🔐</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      SSC 2027 Study Hub
    </p>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Email address"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button id="loginBtn" type="submit">
        Login
      </button>

    </form>

    <div id="message"></div>

    <a class="back" href="index.html">
      ← Back to Home
    </a>

  </div>


  <script>

    const SUPABASE_URL =
      "https://odlqxknocjohpcfpymdj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_DoiZySdq_1PUWpaFXRzE8Q_DNwZrdug";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const loginForm =
      document.getElementById("loginForm");

    const message =
      document.getElementById("message");

    const loginBtn =
      document.getElementById("loginBtn");


    loginForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      loginBtn.disabled = true;
      loginBtn.innerText = "Logging in...";
      message.innerText = "";


      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        message.style.color = "#ff8080";
        message.innerText =
          "❌ Login failed. Email or password is incorrect.";

        loginBtn.disabled = false;
        loginBtn.innerText = "Login";

        return;
      }


      message.style.color = "#7ee787";
      message.innerText =
        "✅ Login successful!";


      setTimeout(function() {

        window.location.href = "index.html";

      }, 700);

    });


    // If already logged in, go to Home
    supabaseClient.auth.getSession().then(function(result) {

      if (result.data.session) {
        window.location.href = "index.html";
      }

    });

  </script>

</body>
  </html>
