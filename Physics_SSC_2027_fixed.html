function makeMCQ(){
return mcqs.map((m,i)=>`<div class="mcq"><p><b>${i+1}. ${m[0]}</b></p><p>${m[1]}</p><p>${m[2]}</p><p>${m[3]}</p><div class="answer">✅ উত্তর: ${m[4]}</div></div>`).join("");
}
function genericMCQ(){
return `<div class="study-section"><h3>❓ MCQ</h3><p>এই অধ্যায়ের MCQ সেট পরে যোগ করা যাবে।</p></div>`;
}
function openStudy(ch,type){
const d=studyData[ch];document.getElementById("studyTitle").textContent=d.title;
let content=type==="notes"?d.notes:type==="cq"?d.cq:(d.mcq==="ch1"?makeMCQ():genericMCQ());
document.getElementById("studyContent").innerHTML=content;
document.getElementById("studyModal").style.display="block";
}
function closeStudy(){document.getElementById("studyModal").style.display="none"}
window.onclick=e=>{if(e.target===document.getElementById("studyModal"))closeStudy()};
</script>
